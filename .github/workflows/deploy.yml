name: Deploy Website and Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::220664822853:role/GitHubActions-S3-Deploy
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://yaman-s3-image-website --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "lambda_function.py"

      - name: Package Lambda
        run: |
          zip lambda.zip lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name image-upload \
            --zip-file fileb://lambda.zip
