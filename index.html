
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S3 Image Upload</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #173f5f;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #173f5f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2d44;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My S3 Image Upload - GitHub</h1>

        <p class="subtitle">
            Upload an image
        </p>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            onchange="previewImage()"
        >

        <img id="preview" alt="Image Preview">

        <button id="uploadButton" onclick="uploadImage()">
            Upload Image
        </button>

        <p id="status"></p>

    </div>

    <script>

        const LAMBDA_URL =
            "https://4pzf7mmy2rmqsraik5tmetk3yq0fvngh.lambda-url.ap-south-1.on.aws/";

        function previewImage() {

            const fileInput =
                document.getElementById("imageInput");

            const preview =
                document.getElementById("preview");

            const file = fileInput.files[0];

            if (!file) {
                preview.style.display = "none";
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }


        async function uploadImage() {

            const fileInput =
                document.getElementById("imageInput");

            const button =
                document.getElementById("uploadButton");

            const status =
                document.getElementById("status");

            if (!fileInput.files.length) {

                status.textContent =
                    "Please select an image.";

                return;
            }

            const file = fileInput.files[0];

            button.disabled = true;
            status.textContent = "Uploading...";

            try {

                const base64 =
                    await fileToBase64(file);

                const response = await fetch(
                    LAMBDA_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "text/plain"
                        },

                        body: base64
                    }
                );

                const result =
                    await response.json();

                if (response.ok) {

                    status.textContent =
                        "Image uploaded successfully!";

                } else {

                    status.textContent =
                        "Upload failed: " +
                        (result.error || "Unknown error");
                }

            } catch (error) {

                console.error(error);

                status.textContent =
                    "Upload error: " +
                    error.message;

            } finally {

                button.disabled = false;
            }
        }


        function fileToBase64(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();

                    reader.onload = () => {

                        const base64 =
                            reader.result.split(",")[1];

                        resolve(base64);
                    };

                    reader.onerror = reject;

                    reader.readAsDataURL(file);
                }
            );
        }

    </script>

</body>
</html>
